{% extends "base.html" %}
{% block title %}Petrol Khata - Change Password{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Change Password</h1>
    <div class="subtitle">Changes only your own login ({{ current_user.username }}).</div>
  </div>
  <a href="{{ url_for('ledger') }}" class="btn btn-ghost">&larr; Back to Ledger</a>
</div>

<div class="panel">
  <form method="post" class="form-grid">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Current password
      <input type="password" name="current_password" required autocomplete="current-password">
    </label>
    <label>New password <span class="hint-sm">at least 10 characters</span>
      <input type="password" name="new_password" required minlength="10" autocomplete="new-password">
    </label>
    <label>Confirm new password
      <input type="password" name="confirm_password" required minlength="10" autocomplete="new-password">
    </label>
    <button type="submit" class="btn">Change Password</button>
  </form>
</div>
{% endblock %}
