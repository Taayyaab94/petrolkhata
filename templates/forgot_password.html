<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<!-- No-flash theme bootstrap - see templates/base.html for the full
     explanation. -->
<script>
(function () {
  try {
    var t = localStorage.getItem("pk-theme");
    if (t === "light" || t === "dark") {
      document.documentElement.dataset.theme = t;
    }
  } catch (e) { /* localStorage unavailable (private mode, etc.) - stay dark */ }
})();
</script>
<title>Petrol Khata - Forgot Password</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="login-shell">
  <div class="login-box">
    <div class="mark">P</div>
    <h1>Forgot your password?</h1>
    <p class="tagline">Enter the email on your account and we'll send a link to reset it.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-list">
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Email
        <input type="email" name="email" required autofocus>
      </label>
      <button type="submit" class="btn btn-block">Send Reset Link</button>
    </form>
    <p class="tagline" style="margin-top:var(--s4);">
      <a href="{{ url_for('login') }}">&larr; Back to log in</a>
    </p>
  </div>
</div>
</body>
</html>
