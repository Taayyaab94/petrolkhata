<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petrol Khata - Reset Password</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="login-shell">
  <div class="login-box">
    <div class="mark">P</div>
    <h1>Choose a new password</h1>
    <p class="tagline">This link can only be used once.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-list">
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>New password <span class="hint-sm">at least 10 characters</span>
        <input type="password" name="password" required minlength="10" autocomplete="new-password" autofocus>
      </label>
      <label>Confirm new password
        <input type="password" name="confirm_password" required minlength="10" autocomplete="new-password">
      </label>
      <button type="submit" class="btn btn-block">Reset Password</button>
    </form>
  </div>
</div>
</body>
</html>
